<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudentBid - Create Listing</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-white text-gray-900 min-h-screen flex flex-col">

    <!-- Header -->
    <div id="header-placeholder"></div>

    <main class="flex-1 max-w-4xl mx-auto w-full px-6 py-10">

        <!-- Page title -->
        <section class="mb-8">
            <h1 id="form-title" class="text-3xl font-bold text-gray-900">
                Create Listing
            </h1>

            <p class="mt-2 text-sm text-gray-500">
                Create a new listing and let other users place bids.
            </p>
        </section>

        <!-- Listing form -->
        <section class="border border-gray-200 rounded-lg p-6">

            <form id="listing-form" class="space-y-6">

                <!-- Title -->
                <div>
                    <label
                        for="listing-title"
                        class="block text-sm font-semibold text-gray-700 mb-2"
                    >
                        Title
                    </label>

                    <input
                        id="listing-title"
                        name="title"
                        type="text"
                        required
                        placeholder="Enter listing title"
                        class="w-full h-11 px-3 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-purple-500"
                    >
                </div>

                <!-- Description -->
                <div>
                    <label
                        for="listing-description"
                        class="block text-sm font-semibold text-gray-700 mb-2"
                    >
                        Description
                    </label>

                    <textarea
                        id="listing-description"
                        name="description"
                        rows="5"
                        placeholder="Describe your item"
                        class="w-full px-3 py-3 border border-gray-300 rounded-lg text-sm resize-none focus:outline-none focus:ring-2 focus:ring-purple-500"
                    ></textarea>
                </div>

                <!-- Media -->
                <div>
                    <label
                        for="listing-media"
                        class="block text-sm font-semibold text-gray-700 mb-2"
                    >
                        Image URL
                    </label>

                    <input
                        id="listing-media"
                        name="media"
                        type="url"
                        placeholder="https://example.com/image.jpg"
                        class="w-full h-11 px-3 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-purple-500"
                    >

                    <p class="mt-1 text-xs text-gray-500">
                        Add a URL to an image for your listing.
                    </p>
                </div>

                <!-- Deadline -->
                <div>
                    <label
                        for="listing-deadline"
                        class="block text-sm font-semibold text-gray-700 mb-2"
                    >
                        Auction deadline
                    </label>

                    <input
                        id="listing-deadline"
                        name="endsAt"
                        type="datetime-local"
                        required
                        class="w-full h-11 px-3 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-purple-500"
                    >
                </div>

                <!-- Message -->
                <p
                    id="listing-message"
                    class="hidden text-sm"
                    aria-live="polite"
                ></p>

                <!-- Buttons -->
                <div class="flex flex-col sm:flex-row gap-3 pt-2">

                    <button
                        id="listing-submit-button"
                        type="submit"
                        class="px-6 py-2.5 bg-purple-600 text-white text-sm font-semibold rounded-lg hover:bg-purple-700 transition"
                    >
                        Create Listing
                    </button>

                    <a
                        href="/profile.html"
                        class="px-6 py-2.5 border border-gray-300 text-gray-700 text-sm font-semibold rounded-lg hover:bg-gray-50 transition text-center"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </section>

    </main>

    <!-- Footer -->
    <div id="footer-placeholder"></div>

    <script type="module" src="/src/js/includes.js"></script>
    <script type="module" src="/src/pages/create-list.js"></script>

</body>
</html>
