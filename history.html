<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentBid - History</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-white text-gray-900 min-h-screen flex flex-col">

    <div id="header-placeholder"></div>

    <main class="flex-1 max-w-6xl mx-auto w-full px-6 py-10">

        <!-- Page title -->
        <section class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900">
                History
            </h1>
        </section>

        <!-- Bought / Sold tabs -->
        <section class="mb-6">
            <div class="flex gap-2">
                <button
                    id="bought-button"
                    type="button"
                    class="px-6 py-2 rounded-lg bg-purple-600 text-white text-sm font-semibold hover:bg-purple-700 transition"
                >
                    Bought
                </button>

                <button
                    id="sold-button"
                    type="button"
                    class="px-6 py-2 rounded-lg bg-[#111747] text-white text-sm font-semibold hover:bg-purple-600 transition"
                >
                    Sold
                </button>
            </div>
        </section>

        <!-- Date filters -->
        <section class="mb-8">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">

                <div>
                    <label
                        for="from-date"
                        class="block text-sm font-semibold text-gray-700 mb-2"
                    >
                        From
                    </label>

                    <input
                        id="from-date"
                        type="date"
                        class="w-full h-10 px-3 rounded-lg bg-[#111747] text-white text-sm
                               focus:outline-none focus:ring-2 focus:ring-purple-500"
                    >
                </div>

                <div>
                    <label
                        for="to-date"
                        class="block text-sm font-semibold text-gray-700 mb-2"
                    >
                        To
                    </label>

                    <input
                        id="to-date"
                        type="date"
                        class="w-full h-10 px-3 rounded-lg bg-[#111747] text-white text-sm
                               focus:outline-none focus:ring-2 focus:ring-purple-500"
                    >
                </div>

            </div>

            <div class="flex gap-2">

                <button
                    id="history-search-button"
                    type="button"
                    class="px-6 py-2 rounded-lg bg-[#111747] text-white text-sm font-semibold
                           hover:bg-purple-600 transition"
                >
                    Search
                </button>

                <button
                    id="history-reset-button"
                    type="button"
                    class="px-6 py-2 rounded-lg bg-purple-600 text-white text-sm font-semibold
                           hover:bg-purple-700 transition"
                >
                    Reset
                </button>

            </div>

        </section>

        <!-- History table -->
        <section>

            <div class="overflow-x-auto rounded-lg">

                <table class="w-full text-sm">

                    <thead>
                        <tr class="bg-[#111747] text-white">

                            <th class="px-4 py-3 text-left font-semibold">
                                Product
                            </th>

                            <th class="px-4 py-3 text-left font-semibold">
                                User
                            </th>

                            <th class="px-4 py-3 text-left font-semibold">
                                Final Amount
                            </th>

                            <th class="px-4 py-3 text-left font-semibold">
                                Purchase Date
                            </th>

                            <th class="px-4 py-3 text-left font-semibold">
                                Status
                            </th>

                            <th class="px-4 py-3 text-center font-semibold">
                            </th>

                        </tr>
                    </thead>

                    <tbody
                        id="history-list"
                        class="divide-y divide-gray-200 bg-white"
                    >
                        <!-- History entries populated by history.js -->
                    </tbody>

                </table>

            </div>

            <!-- Empty state -->
            <p
                id="history-empty"
                class="hidden text-center text-sm text-gray-500 py-8"
            >
                No history found.
            </p>

        </section>

    </main>

    <div id="footer-placeholder"></div>

    <script type="module" src="/src/js/includes.js"></script>
    <script type="module" src="/src/pages/history.js"></script>

</body>

</html>
