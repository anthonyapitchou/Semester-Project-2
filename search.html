<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudentBid - Search</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-white text-gray-900">

    <!-- Header -->
    <div id="header-placeholder"></div>


    <main class="flex-1 max-w-6xl mx-auto w-full px-6 py-10">

        <!-- Search and filters -->
        <section class="mb-8">

            <div class="flex flex-col md:flex-row items-stretch md:items-center gap-4">

                <!-- Search -->
                <div class="relative flex-1">

                    <label for="search-input" class="sr-only">
                        Search listings
                    </label>

                    <input
                        type="search"
                        id="search-input"
                        placeholder="What are you looking for?"
                        class="w-full h-10 px-4 pr-10 rounded-lg bg-[#111747] text-white
                               text-sm placeholder:text-white/80
                               focus:outline-none focus:ring-2 focus:ring-purple-500"
                    >

                    <!-- Search icon -->
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        class="absolute right-3 top-1/2 -translate-y-1/2
                               w-4 h-4 text-white pointer-events-none"
                        aria-hidden="true"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="m21 21-4.35-4.35m1.35-5.65a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"
                        />
                    </svg>

                </div>


                <!-- Category filter -->
                <div class="w-full md:w-36">

                    <label for="category-filter" class="sr-only">
                        Filter by category
                    </label>

                    <select
                        id="category-filter"
                        class="w-full h-10 px-3 rounded-lg bg-[#111747] text-white
                               text-sm focus:outline-none focus:ring-2 focus:ring-purple-500"
                    >
                        <option value="">Category</option>
                        <option value="clothing">Clothing</option>
                        <option value="furniture">Furniture</option>
                        <option value="electronics">Electronics</option>
                        <option value="other">Other</option>
                    </select>

                </div>


                <!-- Sort filter -->
                <div class="w-full md:w-36">

                    <label for="sort-filter" class="sr-only">
                        Sort listings
                    </label>

                    <select
                        id="sort-filter"
                        class="w-full h-10 px-3 rounded-lg bg-[#111747] text-white
                               text-sm focus:outline-none focus:ring-2 focus:ring-purple-500"
                    >
                        <option value="">Sort by</option>
                        <option value="newest">Newest</option>
                        <option value="ending-soon">Ending soon</option>
                        <option value="price-low">Price: low to high</option>
                        <option value="price-high">Price: high to low</option>
                    </select>

                </div>

            </div>

        </section>


        <!-- Listings -->
        <section>

            <h1 class="sr-only">
                Search results
            </h1>

            <div
                id="search-results"
                class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"
            >
                <!-- Listings populated by search.js -->
            </div>

        </section>

    </main>


    <!-- Footer -->
    <div id="footer-placeholder"></div>


    <!-- Components -->
    <script type="module" src="/src/js/includes.js"></script>
    <script type="module" src="/src/pages/search.js"></script>

</body>

</html>
