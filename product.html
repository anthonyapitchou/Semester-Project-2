<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudentBid - Product</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-white text-gray-900 min-h-screen flex flex-col">

    <!-- Header -->
    <div id="header-placeholder"></div>


    <main class="flex-1 max-w-6xl mx-auto w-full px-6 py-10">

        <!-- Product -->
        <section class="grid grid-cols-1 md:grid-cols-2 gap-8 items-start">

            <!-- Product image -->
            <div>
                <img
                    id="product-image"
                    src=""
                    alt=""
                    class="w-full h-105 object-cover rounded-lg"
                >
            </div>


            <!-- Product information -->
            <div class="flex flex-col">

                <!-- Category -->
                <p
                    id="product-category"
                    class="text-sm font-semibold text-purple-600"
                >
                </p>


                <!-- Title -->
                <h1
                    id="product-title"
                    class="mt-1 text-3xl font-bold text-gray-900"
                >
                </h1>


                <!-- Product details -->
                <div class="mt-4 space-y-1 text-sm text-gray-700">

                    <p>
                        <span class="font-semibold">Time left:</span>
                        <span id="product-time-left"></span>
                    </p>

                    <p>
                        <span class="font-semibold">Bids:</span>
                        <span id="product-bids"></span>
                    </p>

                    <p>
                        <span class="font-semibold">Status:</span>
                        <span id="product-status"></span>
                    </p>

                    <p>
                        <span class="font-semibold">Seller:</span>
                        <span id="product-seller"></span>
                    </p>

                </div>


                <!-- Divider -->
                <div class="border-t border-gray-200 my-5"></div>


                <!-- Current price -->
                <div>

                    <p class="text-sm text-gray-500">
                        Current price
                    </p>

                    <p
                        id="product-price"
                        class="mt-1 text-2xl font-bold text-gray-900"
                    >
                    </p>

                    <p
                        id="product-ending"
                        class="mt-1 text-sm text-gray-500"
                    >
                    </p>

                </div>


                <!-- Bid form -->
                <form
                    id="bid-form"
                    class="mt-5"
                >

                    <label
                        for="bid-amount"
                        class="block text-sm font-semibold text-gray-700 mb-2"
                    >
                        Your bid
                    </label>

                    <div class="flex gap-2">

                        <input
                            id="bid-amount"
                            type="number"
                            min="0"
                            step="1"
                            placeholder="Enter your bid"
                            class="flex-1 h-10 px-3 border border-gray-300 rounded-lg
                                   text-sm focus:outline-none focus:ring-2
                                   focus:ring-purple-500"
                        >

                        <button
                            id="place-bid-button"
                            type="submit"
                            class="px-5 h-10 bg-purple-600 text-white text-sm
                                   font-semibold rounded-lg hover:bg-purple-700
                                   transition"
                        >
                            Place Bid
                        </button>

                    </div>

                    <p
                        id="bid-message"
                        class="mt-2 text-sm"
                    ></p>

                </form>

            </div>

        </section>


        <!-- Description -->
<!-- Description -->
<section class="mt-10">

    <h2 class="text-xl font-bold text-gray-900 mb-3">
        Description
    </h2>

    <p
        id="product-description"
        class="text-sm text-gray-600 leading-relaxed"
    >
    </p>

</section>

<!-- Bid history -->
<section class="mt-12">
      <h2 class="text-xl font-bold text-gray-900 mb-6">
        Explore more
    </h2>

    <div
        id="explore-more"
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"
    >
    </div>

    <h2 class="text-xl font-bold text-gray-900 mb-4">
        Bid history
    </h2>

    <div class="overflow-x-auto rounded-lg border border-gray-200">

        <table class="w-full text-sm">

            <thead class="bg-[#111747] text-white">

                <tr>
                    <th class="px-4 py-3 text-left">
                        Bidder
                    </th>

                    <th class="px-4 py-3 text-left">
                        Amount
                    </th>

                    <th class="px-4 py-3 text-left">
                        Date
                    </th>
                </tr>

            </thead>

            <tbody
                id="bid-history"
                class="divide-y divide-gray-200"
            >
            </tbody>

        </table>

    </div>

    <p
        id="bid-history-empty"
        class="hidden text-sm text-gray-500 mt-4"
    >
        No bids yet.
    </p>

    <tbody id="bid-history">
        

</section>
    </main>


    <!-- Footer -->
    <div id="footer-placeholder"></div>


    <!-- Components -->
    <script type="module" src="/src/js/includes.js"></script>
    <script type="module" src="/src/pages/product.js"></script>

</body>

</html>
