<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - StudentBid</title>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-8">

  <!-- Bounded card containing the whole layout -->
<div class="w-full max-w-5xl bg-slate-900 rounded-2xl grid grid-cols-1 md:grid-cols-2 gap-8 overflow-hidden">
  
    <!-- Left column: logo + text -->
<div class="p-10 flex flex-col justify-between">
  
  <img src="./src/assets/studentbid_logo_white_bg_v2.svg" alt="StudentBid"
           class="h-13 w-fit rounded-[10px] bg-white p-1" />
      <p class="text-slate-300 text-xl italic max-w-xs">
        Discover new listings and make your next winning bid.
      </p>
    </div>

    <!-- Right column: toggle + form -->
<div class="p-6 flex flex-col justify-center">

      <!-- Register / Login toggle links -->
      <div class="flex gap-2 mb-6">
        <a href="/Semester-Project-2/register.html"
           class="flex-1 text-center py-2 rounded-full bg-slate-700 text-slate-300 font-semibold hover:bg-slate-600 transition">
          Register
        </a>
        <a href="/Semester-Project-2/login.html"
           class="flex-1 text-center py-2 rounded-full bg-purple-600 text-white font-semibold">
          Login
        </a>
      </div>

      <!-- Login form card -->
      <div class="bg-white rounded-xl p-6 shadow-lg">
        <h2 class="text-xl font-bold mb-4">Login to your account</h2>

        <form id="login-form" class="space-y-4">
          <div>
            <label for="login-email" class="text-sm font-medium block mb-1">Email</label>
            <input type="email" id="login-email" required
              class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
          <div>
            <label for="login-password" class="text-sm font-medium block mb-1">Password</label>
            <input type="password" id="login-password" required
              class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>

          <!-- Error message shown if login fails -->
          <p id="login-error" class="text-red-500 text-sm hidden"></p>

          <button type="submit"
            class="w-full bg-purple-600 text-white py-2 rounded-lg font-semibold hover:bg-purple-700 transition">
            Login now
          </button>

          <p class="text-center text-sm text-gray-500">
            Don't have an account?
            <a href="/Semester-Project-2/register.html" class="text-purple-600 font-semibold">Sign up</a>
          </p>
        </form>
      </div>

    </div>

  </div>

  <script type="module" src="./src/pages/login.js"></script>
</body>
</html>
