<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudentBid - Create Listing</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-white text-gray-900 min-h-screen flex flex-col">

    <div id="header-placeholder"></div>

    <main class="flex-1 max-w-6xl mx-auto w-full px-6 py-10">

        <section class="max-w-3xl mx-auto">

            <h1 class="text-3xl font-bold text-gray-900 mb-8">
                Create Listing
            </h1>

            <form id="create-listing-form" class="space-y-6">

                <div>
                    <label
                        for="image-url"
                        class="block text-sm font-semibold text-gray-700 mb-2"
                    >
                        Image URL
                    </label>

                    <input
                        id="image-url"
                        type="url"
                        placeholder="Enter image URL"
                        class="w-full h-10 px-3 border border-black rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-purple-500"
                    >
                </div>


                <div>
                    <label
                        for="product-name"
                        class="block text-sm font-semibold text-gray-700 mb-2"
                    >
                        Product name
                    </label>

                    <input
                        id="product-name"
                        type="text"
                        required
                        placeholder="Enter product name"
                        class="w-full h-10 px-3 border border-black rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-purple-500"
                    >
                </div>


                <div>
                    <label
                        for="product-description"
                        class="block text-sm font-semibold text-gray-700 mb-2"
                    >
                        Description
                    </label>

                    <textarea
                        id="product-description"
                        rows="5"
                        placeholder="Describe your product"
                        class="w-full px-3 py-2 border border-black rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-purple-500"
                    ></textarea>
                </div>


                <div>
                    <label
                        for="starting-price"
                        class="block text-sm font-semibold text-gray-700 mb-2"
                    >
                        Starting price
                    </label>

                    <input
                        id="starting-price"
                        type="number"
                        min="0"
                        step="1"
                        placeholder="Enter starting price"
                        class="w-full h-10 px-3 border border-black rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-purple-500"
                    >
                </div>


                <div>
                    <label
                        for="bid-increment"
                        class="block text-sm font-semibold text-gray-700 mb-2"
                    >
                        Bid increment
                    </label>

                    <input
                        id="bid-increment"
                        type="number"
                        min="0"
                        step="1"
                        placeholder="Enter bid increment"
                        class="w-full h-10 px-3 border border-black rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-purple-500"
                    >
                </div>


                <div>
                    <label
                        for="closing-time"
                        class="block text-sm font-semibold text-gray-700 mb-2"
                    >
                        Closing time
                    </label>

                    <input
                        id="closing-time"
                        type="datetime-local"
                        required
                        class="w-full h-10 px-3 border border-black rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-purple-500"
                    >
                </div>


                <div>
                    <label
                        for="category"
                        class="block text-sm font-semibold text-gray-700 mb-2"
                    >
                        Category
                    </label>

                    <input
                        id="category"
                        type="text"
                        placeholder="Enter category"
                        class="w-full h-10 px-3 border border-black rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-purple-500"
                    >
                </div>


                <p
                    id="form-message"
                    class="text-sm"
                    aria-live="polite"
                ></p>


                <div>
                    <button
                        type="submit"
                        class="px-6 py-2 bg-purple-600 text-white text-sm font-semibold rounded-lg hover:bg-purple-700 transition"
                    >
                        Create Listing
                    </button>
                </div>

            </form>

        </section>

    </main>

    <div id="footer-placeholder"></div>

    <script type="module" src="/src/js/includes.js"></script>
    <script type="module" src="/src/pages/create-list.js"></script>

</body>

</html>
